name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # `npm install` (not `npm ci`) tolerates platform-specific optional-dep
        # gaps in the lockfile (e.g. Linux/WASM @emnapi deps that a macOS-
        # generated lock omits), which otherwise hard-fail `npm ci` on the
        # ubuntu runner.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge tests
        run: forge test -vvv
