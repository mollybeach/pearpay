<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="cglow" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#74b327" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#74b327" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="#0a1f12"/>
  <rect width="1440" height="900" fill="url(#cglow)"/>

  <!-- centered claim card column (max-w-md) -->
  <g transform="translate(560,120)">
    <!-- logo badge -->
    <rect x="120" y="0" width="100" height="100" rx="28" fill="#f2fbe7"/>
    <text x="170" y="68" font-size="52" text-anchor="middle">🍐</text>

    <text x="170" y="160" fill="#eafff3" fill-opacity="0.7" font-size="18" text-anchor="middle"><tspan fill="#eafff3" font-weight="700">Molly</tspan> sent you</text>
    <text x="170" y="230" fill="#eafff3" font-size="54" font-weight="800" text-anchor="middle">$20.00</text>
    <text x="170" y="266" fill="#eafff3" fill-opacity="0.6" font-size="16" font-style="italic" text-anchor="middle">“for lunch 🥗”</text>

    <!-- card -->
    <g transform="translate(0,300)">
      <rect width="340" height="200" rx="18" fill="#0f2415" stroke="#ffffff" stroke-opacity="0.1"/>
      <g transform="translate(40,40)"><rect width="260" height="56" rx="14" fill="#74b327"/><text x="130" y="36" fill="#0a1f12" font-size="18" font-weight="800" text-anchor="middle">Claim your funds</text></g>
      <text x="170" y="138" fill="#eafff3" fill-opacity="0.5" font-size="12" text-anchor="middle">We'll create a secure wallet for you</text>
      <text x="170" y="158" fill="#eafff3" fill-opacity="0.5" font-size="12" text-anchor="middle">automatically — no seed phrase, no app.</text>
    </g>

    <text x="170" y="560" fill="#eafff3" fill-opacity="0.35" font-size="12" text-anchor="middle">Powered by Pear Pay 🍐</text>
  </g>
</svg>
