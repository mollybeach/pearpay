<svg width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Neutral gray backdrop (screen-record friendly) -->
  <rect width="1440" height="1024" fill="#1e1e1e"/>

  <text x="720" y="80" fill="#ffffff" font-size="34" font-weight="800" text-anchor="middle">The chat payment <tspan fill="#92cf3f">playground</tspan></text>
  <text x="720" y="116" fill="#ffffff" fill-opacity="0.7" font-size="15" text-anchor="middle">Send money the way it feels inside your chats — type it, confirm in-app, settle in USDC.</text>

  <!-- channel tabs -->
  <g transform="translate(470,150)">
    <rect width="500" height="48" rx="14" fill="#16301a" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(6,6)"><rect width="110" height="36" rx="11" fill="#74b327"/><text x="55" y="24" fill="#0a1f12" font-size="13" font-weight="700" text-anchor="middle">💬 iMessage</text></g>
    <text x="130" y="30" fill="#ffffff" fill-opacity="0.7" font-size="13">✈️ Telegram</text>
    <text x="230" y="30" fill="#ffffff" fill-opacity="0.7" font-size="13">🎮 Discord</text>
    <text x="325" y="30" fill="#ffffff" fill-opacity="0.7" font-size="13">🟢 WhatsApp</text>
    <text x="435" y="30" fill="#ffffff" fill-opacity="0.7" font-size="13">𝕏 X</text>
  </g>

  <!-- quick chips -->
  <g transform="translate(530,222)" font-size="12">
    <g><rect width="130" height="30" rx="15" fill="#16301a" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.1"/><text x="65" y="20" fill="#eafff3" fill-opacity="0.75" text-anchor="middle">Send Molly $20</text></g>
    <g transform="translate(146,0)"><rect width="170" height="30" rx="15" fill="#16301a" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.1"/><text x="85" y="20" fill="#eafff3" fill-opacity="0.75" text-anchor="middle">Send 50 USDC privately</text></g>
    <g transform="translate(332,0)"><rect width="40" height="30" rx="15" fill="#16301a" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.1"/><text x="20" y="20" fill="#eafff3" fill-opacity="0.55" text-anchor="middle">↺</text></g>
  </g>

  <!-- ===== iPhone ===== -->
  <g transform="translate(545,290)">
    <rect width="350" height="700" rx="48" fill="#000000" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="11" y="11" width="328" height="678" rx="38" fill="#000000"/>
    <!-- dynamic island -->
    <rect x="125" y="22" width="100" height="26" rx="13" fill="#000000"/>
    <!-- status bar -->
    <text x="40" y="44" fill="#ffffff" font-size="13" font-weight="600">9:41</text>
    <text x="290" y="44" fill="#ffffff" font-size="12">▮▮▮ 📶 🔋</text>

    <!-- conversation header -->
    <rect x="11" y="60" width="328" height="78" fill="#0c0c0e"/>
    <line x1="11" y1="138" x2="339" y2="138" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="28" y="92" fill="#2c7cf6" font-size="22">‹</text>
    <circle cx="175" cy="90" r="20" fill="#7aab43"/>
    <text x="175" y="97" font-size="18" text-anchor="middle">🙂</text>
    <text x="175" y="128" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Molly ›</text>
    <text x="318" y="96" fill="#2c7cf6" font-size="16" text-anchor="end">▶</text>

    <!-- thread -->
    <text x="175" y="162" fill="#ffffff" fill-opacity="0.35" font-size="10" text-anchor="middle">iMessage · Today 9:41 AM</text>
    <!-- incoming -->
    <g transform="translate(24,176)"><rect width="210" height="56" rx="18" fill="#26262a"/><text x="14" y="26" fill="#ffffff" font-size="14">Can you send me $20</text><text x="14" y="46" fill="#ffffff" font-size="14">for lunch? 🥗</text></g>
    <!-- outgoing -->
    <g transform="translate(214,244)"><rect width="112" height="34" rx="17" fill="#2c7cf6"/><text x="56" y="22" fill="#ffffff" font-size="14" text-anchor="middle">yep one sec</text></g>

    <!-- settled PearPay card -->
    <g transform="translate(70,290)">
      <rect width="256" height="180" rx="18" fill="#0f2415" stroke="#74b327" stroke-opacity="0.35"/>
      <text x="18" y="40" font-size="22">🍐</text>
      <g transform="translate(160,18)"><rect width="78" height="22" rx="11" fill="#74b327" fill-opacity="0.2"/><text x="39" y="16" fill="#aade63" font-size="10" font-weight="700" text-anchor="middle">SETTLED ✅</text></g>
      <text x="18" y="96" fill="#eafff3" font-size="30" font-weight="800">$20.00</text>
      <text x="18" y="122" fill="#eafff3" fill-opacity="0.7" font-size="13">You paid molly.eth</text>
      <g transform="translate(18,138)"><rect width="78" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.2"/><text x="39" y="16" fill="#d6c8ff" font-size="10" text-anchor="middle">🟣 Hedera</text></g>
      <g transform="translate(104,138)"><rect width="52" height="22" rx="11" fill="#ffffff" fill-opacity="0.08"/><text x="26" y="16" fill="#eafff3" fill-opacity="0.75" font-size="10" text-anchor="middle">USDC</text></g>
      <g transform="translate(164,138)"><rect width="58" height="22" rx="11" fill="#ffffff" fill-opacity="0.08"/><text x="29" y="16" fill="#eafff3" fill-opacity="0.75" font-size="10" text-anchor="middle">instant</text></g>
    </g>

    <!-- composer -->
    <g transform="translate(24,486)">
      <circle cx="16" cy="18" r="16" fill="#3a3a3c"/><text x="16" y="24" fill="#ffffff" font-size="18" text-anchor="middle">＋</text>
      <rect x="42" y="2" width="210" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="56" y="24" fill="#ffffff" font-size="14">Send Molly $20</text>
      <circle cx="290" cy="18" r="16" fill="#2c7cf6"/><text x="290" y="24" fill="#ffffff" font-size="16" text-anchor="middle">↑</text>
    </g>

    <!-- keyboard (simplified) -->
    <rect x="11" y="540" width="328" height="149" fill="#161618"/>
    <g fill="#6b6b6f">
      <g transform="translate(20,552)"><rect width="280" height="34" rx="6"/></g>
      <g transform="translate(34,592)"><rect width="252" height="34" rx="6"/></g>
    </g>
    <text x="160" y="574" fill="#ffffff" font-size="13" text-anchor="middle" letter-spacing="6">Q W E R T Y U I O P</text>
    <text x="160" y="614" fill="#ffffff" font-size="13" text-anchor="middle" letter-spacing="6">A S D F G H J K L</text>
    <g fill="#3a3a3c"><rect x="20" y="632" width="60" height="34" rx="6"/><rect x="240" y="632" width="60" height="34" rx="6"/></g>
    <text x="160" y="654" fill="#ffffff" font-size="13" text-anchor="middle" letter-spacing="6">Z X C V B N M</text>
    <g fill="#3a3a3c"><rect x="20" y="672" width="60" height="30" rx="6"/><rect x="240" y="672" width="60" height="30" rx="6"/></g>
    <rect x="90" y="672" width="140" height="30" rx="6" fill="#6b6b6f"/>
    <text x="160" y="692" fill="#ffffff" fill-opacity="0.8" font-size="12" text-anchor="middle">space</text>
    <!-- home indicator -->
    <rect x="143" y="678" width="64" height="4" rx="2" fill="#ffffff" fill-opacity="0.3" transform="translate(0,0)"/>
  </g>
</svg>
