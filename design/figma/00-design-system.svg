<svg width="1440" height="1700" viewBox="0 0 1440 1700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1440" height="1700" fill="#0a1f12"/>
  <rect width="1440" height="600" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#74b327" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#74b327" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <text x="80" y="90" fill="#eafff3" font-size="44" font-weight="800">Pear Pay — Design System</text>
  <text x="80" y="128" fill="#eafff3" fill-opacity="0.6" font-size="18">Pixel tokens extracted from tailwind.config.ts</text>

  <!-- COLORS -->
  <text x="80" y="210" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">COLOR · PEAR PALETTE</text>
  <g>
    <!-- swatch generator: each 120 wide, 90 tall, gap 12 -->
    <g transform="translate(80,230)"><rect width="120" height="90" rx="12" fill="#f2fbe7"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-50</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#f2fbe7</text></g>
    <g transform="translate(212,230)"><rect width="120" height="90" rx="12" fill="#e3f6cb"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-100</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#e3f6cb</text></g>
    <g transform="translate(344,230)"><rect width="120" height="90" rx="12" fill="#c9ed9c"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-200</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#c9ed9c</text></g>
    <g transform="translate(476,230)"><rect width="120" height="90" rx="12" fill="#aade63"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-300</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#aade63</text></g>
    <g transform="translate(608,230)"><rect width="120" height="90" rx="12" fill="#92cf3f"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-400</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#92cf3f</text></g>
    <g transform="translate(740,230)"><rect width="120" height="90" rx="12" fill="#74b327"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-500 ★</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#74b327</text></g>
    <g transform="translate(872,230)"><rect width="120" height="90" rx="12" fill="#598c1d"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-600</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#598c1d</text></g>
    <g transform="translate(1004,230)"><rect width="120" height="90" rx="12" fill="#446a1b"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-700</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#446a1b</text></g>
    <g transform="translate(1136,230)"><rect width="120" height="90" rx="12" fill="#39551c"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-800</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#39551c</text></g>
    <g transform="translate(1268,230)"><rect width="120" height="90" rx="12" fill="#16301a"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-900</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#16301a</text></g>
    <g transform="translate(80,380)"><rect width="120" height="90" rx="12" fill="#0a1f12" stroke="#ffffff" stroke-opacity="0.1"/><text x="0" y="112" fill="#eafff3" font-size="12">pear-950 (bg)</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#0a1f12</text></g>
    <g transform="translate(212,380)"><rect width="120" height="90" rx="12" fill="#2e6b2e"/><text x="0" y="112" fill="#eafff3" font-size="12">leaf</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#2e6b2e</text></g>
    <g transform="translate(344,380)"><rect width="120" height="90" rx="12" fill="#eafff3"/><text x="0" y="112" fill="#eafff3" font-size="12">cream (text)</text><text x="0" y="130" fill="#eafff3" fill-opacity="0.55" font-size="11">#eafff3</text></g>
  </g>

  <!-- TYPOGRAPHY -->
  <text x="80" y="540" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">TYPOGRAPHY · system-ui</text>
  <text x="80" y="600" fill="#eafff3" font-size="60" font-weight="800">Display / 60 / 800</text>
  <text x="80" y="650" fill="#eafff3" font-size="36" font-weight="700">Heading / 36 / 700</text>
  <text x="80" y="688" fill="#eafff3" font-size="18" font-weight="600">Subhead / 18 / 600</text>
  <text x="80" y="722" fill="#eafff3" fill-opacity="0.75" font-size="16">Body / 16 / 400 — cream at 75% opacity for paragraphs</text>
  <text x="80" y="752" fill="#eafff3" fill-opacity="0.45" font-size="12" letter-spacing="1">CAPTION / 12 / UPPERCASE TRACKING</text>

  <!-- BUTTONS -->
  <text x="80" y="840" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">BUTTONS</text>
  <g transform="translate(80,860)">
    <rect width="190" height="52" rx="14" fill="#74b327"/>
    <text x="95" y="33" fill="#0a1f12" font-size="16" font-weight="700" text-anchor="middle">Primary · Pay 🍐</text>
  </g>
  <g transform="translate(290,860)">
    <rect width="190" height="52" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="95" y="33" fill="#eafff3" font-size="16" font-weight="600" text-anchor="middle">Secondary</text>
  </g>
  <g transform="translate(500,866)">
    <rect width="150" height="40" rx="20" fill="#16301a" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="75" y="26" fill="#eafff3" fill-opacity="0.75" font-size="13" text-anchor="middle">Pill / chip</text>
  </g>

  <!-- PAYMENT CARD -->
  <text x="80" y="990" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">COMPONENT · PEAR PAY CARD (settled)</text>
  <g transform="translate(80,1010)">
    <rect width="340" height="200" rx="18" fill="#0f2415" stroke="#74b327" stroke-opacity="0.35"/>
    <text x="22" y="44" font-size="24">🍐</text>
    <g transform="translate(248,22)"><rect width="92" height="24" rx="12" fill="#74b327" fill-opacity="0.2"/><text x="46" y="17" fill="#aade63" font-size="11" font-weight="700" text-anchor="middle">SETTLED ✅</text></g>
    <text x="22" y="108" fill="#eafff3" font-size="34" font-weight="800">$20.00</text>
    <text x="22" y="138" fill="#eafff3" fill-opacity="0.7" font-size="14">You paid molly.eth</text>
    <g transform="translate(22,156)"><rect width="92" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.2"/><text x="46" y="17" fill="#d6c8ff" font-size="11" text-anchor="middle">🟣 Hedera</text></g>
    <g transform="translate(122,156)"><rect width="64" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="32" y="17" fill="#eafff3" fill-opacity="0.75" font-size="11" text-anchor="middle">USDC</text></g>
    <g transform="translate(196,156)"><rect width="70" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="35" y="17" fill="#eafff3" fill-opacity="0.75" font-size="11" text-anchor="middle">instant</text></g>
  </g>

  <!-- TAG / BADGE variants -->
  <text x="480" y="990" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">BADGES</text>
  <g transform="translate(480,1010)"><rect width="110" height="28" rx="14" fill="#74b327" fill-opacity="0.2"/><text x="55" y="19" fill="#aade63" font-size="12" font-weight="700" text-anchor="middle">SETTLED ✅</text></g>
  <g transform="translate(480,1050)"><rect width="120" height="28" rx="14" fill="#f59e0b" fill-opacity="0.18"/><text x="60" y="19" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">CLAIMABLE ⏳</text></g>
  <g transform="translate(480,1090)"><rect width="110" height="28" rx="14" fill="#a3a3a3" fill-opacity="0.25"/><text x="55" y="19" fill="#ededed" font-size="12" font-weight="700" text-anchor="middle">PRIVATE 🕶️</text></g>

  <!-- CHANNEL TABS -->
  <text x="80" y="1290" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">COMPONENT · CHANNEL TABS</text>
  <g transform="translate(80,1310)">
    <rect width="720" height="56" rx="16" fill="#16301a" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(8,8)"><rect width="130" height="40" rx="12" fill="#74b327"/><text x="65" y="26" fill="#0a1f12" font-size="14" font-weight="700" text-anchor="middle">💬 iMessage</text></g>
    <text x="160" y="34" fill="#eafff3" fill-opacity="0.7" font-size="14">✈️ Telegram</text>
    <text x="285" y="34" fill="#eafff3" fill-opacity="0.7" font-size="14">🎮 Discord</text>
    <text x="405" y="34" fill="#eafff3" fill-opacity="0.7" font-size="14">🟢 WhatsApp</text>
    <text x="540" y="34" fill="#eafff3" fill-opacity="0.7" font-size="14">💼 Slack</text>
    <text x="640" y="34" fill="#eafff3" fill-opacity="0.7" font-size="14">𝕏 X</text>
  </g>

  <!-- INPUT FIELD -->
  <text x="80" y="1450" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">INPUT</text>
  <g transform="translate(80,1470)">
    <rect width="420" height="52" rx="14" fill="#0a1f12" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="33" fill="#eafff3" fill-opacity="0.4" font-size="15">you@example.com</text>
  </g>

  <!-- LOGO BADGE -->
  <text x="560" y="1450" fill="#92cf3f" font-size="13" letter-spacing="2" font-weight="700">LOGO BADGE</text>
  <g transform="translate(560,1470)">
    <rect width="80" height="80" rx="24" fill="#f2fbe7"/>
    <text x="40" y="56" font-size="40" text-anchor="middle">🍐</text>
  </g>
  <text x="660" y="1505" fill="#eafff3" font-size="22" font-weight="800">Pear<tspan fill="#92cf3f">Pay</tspan></text>
</svg>
